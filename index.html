<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6cc6e0">
<title>Kachelhausen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=238">
</head>
<body>
<canvas id="world"></canvas>

<div id="hud">
  <button class="pill town" id="town-btn" aria-label="Rathaus"><span class="flag" id="hud-flag"></span><b id="town-name"></b></button>
  <button class="pill money" id="money-btn" aria-label="Taler">🪙 <b id="money">0</b><small class="more" id="rate">+0/s</small></button>
  <button class="pill" id="pop-btn" aria-label="Einwohner und Arbeitsplätze">👥 <b id="pop">0</b><small class="more" id="jobs"></small></button>
  <button class="pill sci" id="sci-btn" aria-label="Forschung">💡 <b id="sci">0</b><small class="more" id="sci-rate"></small><span class="dot" id="sci-dot" hidden></span></button>
  <button class="pill store" id="store-btn" aria-label="Lager">📦<span class="flash" id="store-flash" hidden></span></button>
  <button class="pill" id="menu-btn" aria-label="Menü">☰<span class="dot" id="diary-dot" hidden></span></button>
</div>
<div id="store" hidden></div>

<button id="goal" aria-label="Nächstes Ziel"></button>
<div id="hint" hidden></div>
<div id="card-name" hidden></div>
<div id="style-bar" hidden></div>
<button id="rot-btn" hidden aria-label="Drehen">⟳</button>
<div id="panel" hidden></div>
<div id="achv" hidden></div>
<div id="toast" hidden></div>
<div id="toolbar">
  <div class="cats" id="cats"></div>
  <div class="cats subcats" id="subcats" hidden></div>
  <div class="tools" id="tools"></div>
</div>
<div id="modal" hidden><div class="card" id="modal-card"></div></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="js/data.js?v=238"></script>
<script src="js/state.js?v=238"></script>
<script src="js/world.js?v=238"></script>
<script src="js/rules.js?v=238"></script>
<script src="js/audio.js?v=238"></script>
<script src="js/actions.js?v=238"></script>
<script src="js/plan.js?v=238"></script>
<script src="js/story.js?v=238"></script>
<script src="js/input.js?v=238"></script>
<script src="js/draw-base.js?v=238"></script>
<script src="js/draw-kit.js?v=238"></script>
<script src="js/draw-objects.js?v=238"></script>
<script src="js/draw-edges.js?v=238"></script>
<script src="js/draw-buildings.js?v=238"></script>
<script src="js/draw-shops.js?v=238"></script>
<script src="js/shopart/a.js?v=238"></script>
<script src="js/shopart/b.js?v=238"></script>
<script src="js/shopart/c.js?v=238"></script>
<script src="js/shopart/d.js?v=238"></script>
<script src="js/shopart/e.js?v=238"></script>
<script src="js/shopart/f.js?v=238"></script>
<script src="js/shopart/g.js?v=238"></script>
<script src="js/draw-landmarks.js?v=238"></script>
<script src="js/draw-wonders.js?v=238"></script>
<script src="js/movers.js?v=238"></script>
<script src="js/render.js?v=238"></script>
<script src="js/ui.js?v=238"></script>
<script src="js/main.js?v=238"></script>
</body>
</html>
