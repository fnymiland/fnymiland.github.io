<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basar-Durchsicht</title>
<!-- Nutzer 27.10.2026: „alle Items aus dem Sternenbasar genauer ansehen, da gibt es noch Dinge, die mir nicht gefallen“.
     Links das echte Spiel (Testwelt, speichert nichts) mit allen Basar-Stücken auf der Wiese (tools/basar-schau.js),
     rechts die Liste: antippen springt hin, „passt“ / „ändern“ und eine Notiz je Stück. Gemerkt im Browser, „Liste kopieren“ für den Chat. -->
<style>
  :root { --bg: #f3efe6; --card: #fffdf8; --tx: #2c2a24; --mu: #77705f; --edge: #ddd3bf; --ok: #5c9c43; --ok-soft: #e4f1db; --no: #c9603f; --no-soft: #f8e1d8; --sel: #f5c84b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font: 500 14px/1.35 system-ui, -apple-system, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--edge); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  #count { color: var(--mu); }
  .grow { flex: 1; }
  button { font: inherit; font-weight: 600; border: 1.5px solid var(--edge); background: #fff; color: var(--tx); border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  button.on { background: var(--tx); border-color: var(--tx); color: #fff; }
  #game { width: 100%; height: 100%; border: 0; display: block; background: #84c6dd; }
  #list { overflow-y: auto; padding: 10px 12px 40px; border-left: 1px solid var(--edge); }
  .smlg { margin: 14px 2px 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--mu); }
  .smlg:first-child { margin-top: 2px; }
  .item { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 10px; background: var(--card); border: 1.5px solid var(--edge); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .item.sel { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel); }
  .item.ok { background: var(--ok-soft); }
  .item.no { background: var(--no-soft); }
  .pic { grid-row: span 3; width: 96px; height: 76px; border-radius: 8px; background: #eef5e6; border: 0; padding: 0; display: grid; place-items: center; }
  .pic img { width: 96px; height: 76px; object-fit: contain; }
  .name { font-weight: 700; font-size: 15px; }
  .name small { font-weight: 500; color: var(--mu); margin-left: 4px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { padding: 4px 10px; }
  .row button.okb.on { background: var(--ok); border-color: var(--ok); }
  .row button.nob.on { background: var(--no); border-color: var(--no); }
  textarea { grid-column: 1 / -1; width: 100%; min-height: 34px; resize: vertical; font: inherit; border: 1.5px solid var(--edge); border-radius: 8px; padding: 6px 8px; background: #fff; color: var(--tx); }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(243,239,230,.85); font-size: 16px; font-weight: 600; z-index: 5; }
  #out { position: fixed; inset: 10% 8%; background: var(--card); border: 1.5px solid var(--edge); border-radius: 14px; padding: 12px; display: none; flex-direction: column; gap: 8px; z-index: 6; box-shadow: 0 10px 40px rgba(60,50,30,.25); }
  #out.open { display: flex; }
  #out textarea { flex: 1; }
  @media (max-width: 760px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 46dvh minmax(0, 1fr); }
    #list { border-left: 0; border-top: 1px solid var(--edge); }
  }
</style>
</head>
<body>
<header>
  <h1>Sternenbasar durchsehen</h1>
  <span id="count"></span>
  <span class="grow"></span>
  <button id="day" class="on">Tag</button>
  <button id="nite">Nacht</button>
  <button id="copy">Liste kopieren</button>
</header>
<iframe id="game" src="../index.html?welt=neu" title="Spiel mit allen Basar-Stücken"></iframe>
<div id="list"></div>
<div id="wait">Stelle alle Basar-Stücke auf …</div>
<div id="out"><b>Deine Liste: kopieren und mir in den Chat schicken</b><textarea id="outText" readonly></textarea><div class="row"><button id="outClose">Schließen</button></div></div>
<script>
(() => {
  const KEY = 'basarSchau1', $ = id => document.getElementById(id);
  let notes = {}; try { notes = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { notes = {}; }
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const frame = $('game');
  let W, R, names = {};

  let src = null;
  const ready = () => { try { W = frame.contentWindow; if (!W.basarBereit) W.eval(src); return W.basarBereit(); } catch (e) { return false; } };
  const start = async () => {
    R = W.basarSchau();
    R.list = R.items.map(it => it.id);
    setNight(false);
    build();
    show(R.list[0], false);
    $('wait').remove();
    setTimeout(() => W.closeModal(), 1500);
  };
  const poll = () => ready() ? start() : setTimeout(poll, 300);
  fetch('basar-schau.js?' + Date.now()).then(r => r.text()).then(t => { src = t; setTimeout(poll, 300); });

  function setNight(on) {
    W.basarNacht(on);
    $('day').classList.toggle('on', !on); $('nite').classList.toggle('on', on);
  }
  $('day').onclick = () => setNight(false);
  $('nite').onclick = () => setNight(true);

  function show(id, scroll = true) {
    W.basarZeige(R.pos[id]);
    document.querySelectorAll('.item.sel').forEach(e => e.classList.remove('sel'));
    const el = document.querySelector(`.item[data-id="${id}"]`);
    if (el) { el.classList.add('sel'); if (scroll) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  function build() {
    const list = $('list'); let last = null, html = '';
    for (const { id, nr, name, smlg, tag, pic: url } of R.items) {
      names[id] = `${nr} ${name}`;
      if (smlg !== last) { html += `<div class="smlg">${esc(smlg)}</div>`; last = smlg; }
      const n = notes[id] || {};
      html += `<div class="item${n.v === 'ok' ? ' ok' : n.v === 'no' ? ' no' : ''}" data-id="${id}">
        <button class="pic" aria-label="${esc(name)} im Spiel zeigen">${url ? `<img src="${url}" alt="">` : ''}</button>
        <div class="name">${nr}. ${esc(name)}<small>${esc(tag)}</small></div>
        <div class="row"><button class="go">Zeigen</button><button class="okb${n.v === 'ok' ? ' on' : ''}">passt</button><button class="nob${n.v === 'no' ? ' on' : ''}">ändern</button></div>
        <div></div>
        <textarea placeholder="Was stört dich?">${esc(n.t || '')}</textarea>
      </div>`;
    }
    list.innerHTML = html;
    list.querySelectorAll('.item').forEach(el => {
      const id = el.dataset.id, n = () => (notes[id] ||= {});
      el.querySelector('.pic').onclick = el.querySelector('.go').onclick = () => show(id, false);
      const mark = v => { n().v = n().v === v ? '' : v; store(); el.classList.toggle('ok', n().v === 'ok'); el.classList.toggle('no', n().v === 'no');
        el.querySelector('.okb').classList.toggle('on', n().v === 'ok'); el.querySelector('.nob').classList.toggle('on', n().v === 'no'); count(); };
      el.querySelector('.okb').onclick = () => mark('ok');
      el.querySelector('.nob').onclick = () => mark('no');
      const ta = el.querySelector('textarea');
      ta.oninput = () => { n().t = ta.value; if (ta.value.trim() && !n().v) mark('no'); store(); };
      ta.onfocus = () => show(id, false);
    });
    count();
  }
  function count() {
    const v = R.list.map(id => (notes[id] || {}).v);
    $('count').textContent = `${R.list.length} Stücke · ${v.filter(x => x === 'ok').length} passt · ${v.filter(x => x === 'no').length} ändern`;
  }
  $('copy').onclick = async () => {
    const lines = R.list.filter(id => notes[id] && (notes[id].v === 'no' || (notes[id].t || '').trim()))
      .map(id => `${names[id]}: ${(notes[id].t || '').trim() || 'gefällt mir nicht'}`);
    const ok = R.list.filter(id => notes[id] && notes[id].v === 'ok').length;
    const text = `Basar-Durchsicht: ${lines.length} ändern, ${ok} passt\n` + (lines.join('\n') || '(nichts markiert)');
    $('outText').value = text; $('out').classList.add('open');
    try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Kopiert ✓'; }
    catch (e) { $('outText').select(); try { document.execCommand('copy'); $('copy').textContent = 'Kopiert ✓'; } catch (e2) {} }
    setTimeout(() => { $('copy').textContent = 'Liste kopieren'; }, 2500);
  };
  $('outClose').onclick = () => $('out').classList.remove('open');
})();
</script>
</body>
</html>
